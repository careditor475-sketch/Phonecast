name = "phonecast"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/ws/*", "/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional, for viewers behind strict networks (cellular, hotel Wi-Fi):
# set these secrets so the relay can hand out Cloudflare TURN credentials.
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_API_TOKEN
