name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships the Android SDK; just make sure the pieces we need are there.
      - name: Install SDK platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release (download it from your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PhoneCast.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneCast.apk \
            --title "PhoneCast (latest build)" \
            --notes "Open this page on your Android phone, download PhoneCast.apk and install it."
